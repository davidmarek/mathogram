name: Validate and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main-branch build
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mathogram-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Quality and production acceptance
    if: >-
      github.repository == 'davidmarek/mathogram' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'davidmarek' &&
      github.triggering_actor == 'davidmarek' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run validate
        env:
          VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_ENDPOINT: ${{ vars.VITE_UMAMI_ENDPOINT }}
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload only the validated build
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Upload validated Azure production files
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-production-${{ github.sha }}
          path: dist
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Publish validated artifact
    needs: validate
    if: >-
      github.repository == 'davidmarek/mathogram' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'davidmarek' &&
      github.triggering_actor == 'davidmarek' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-azure:
    name: Publish validated Azure production artifact
    needs: validate
    if: >-
      github.repository == 'davidmarek/mathogram' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'davidmarek' &&
      github.triggering_actor == 'davidmarek' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    environment:
      name: azure-production
      url: https://mathixel.com/
    steps:
      # No checkout or application code execution with deployment credentials.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-production-${{ github.sha }}
          path: production
      - name: Deploy to the production slot
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: production
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          deployment_environment: ''
