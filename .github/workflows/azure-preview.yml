name: Azure PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: azure-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check PR revision and lifecycle
    if: >-
      github.repository == 'davidmarek/mathogram' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
              throw new Error('Provide a positive PR number without leading zeroes.');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number),
            });
            if (pr.base.repo.full_name !== 'davidmarek/mathogram' || pr.base.ref !== 'main') {
              throw new Error('Only PRs targeting davidmarek/mathogram main are supported.');
            }
            if (pr.state !== 'open' || !/^[a-f0-9]{40}$/.test(process.env.HEAD_SHA) ||
                pr.head.sha !== process.env.HEAD_SHA) {
              throw new Error('PR must be open at the event head SHA. Use the latest workflow run.');
            }
            core.setOutput('number', number);
            core.setOutput('sha', pr.head.sha);

  validate:
    name: Validate PR without deployment credentials
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No shared dependency cache: PR code must not poison production caches.
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run validate
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-preview-failure-${{ needs.resolve.outputs.number }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build preview without deployment credentials
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No shared dependency cache: PR code must not poison production caches.
      - run: npm ci --no-fund
      - run: npm run build
      - name: Upload preview static files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-preview-${{ needs.resolve.outputs.number }}-${{ needs.resolve.outputs.sha }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish preview after approval
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    # All PRs replace the same Azure slot; never interrupt an active upload.
    concurrency:
      group: azure-preview-shared-slot
      cancel-in-progress: false
    environment:
      name: azure-preview
      url: ${{ steps.azure.outputs.static_web_app_url }}
    steps:
      # No checkout or execution of PR code in this credential-bearing job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-preview-${{ needs.resolve.outputs.number }}-${{ needs.resolve.outputs.sha }}
          path: preview
      - name: Configure preview indexing
        run: |
          cat > preview/staticwebapp.config.json <<'JSON'
          {
            "globalHeaders": { "X-Robots-Tag": "noindex, nofollow" }
          }
          JSON
      - name: Reject closed or superseded previews after approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.APPROVED_SHA ||
                pr.base.ref !== 'main' || pr.base.repo.full_name !== 'davidmarek/mathogram') {
              throw new Error('PR closed, changed target, or changed revision while awaiting deployment.');
            }
      # Run the Azure deployment client directly rather than through
      # Azure/static-web-apps-deploy: that action always passes the
      # pull_request event payload, and the client then deploys to a new
      # PR-numbered environment, ignoring deployment_environment. Without the
      # event payload the client honors the shared named environment.
      - name: Deploy static files only to the shared preview environment
        id: azure
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          docker run --rm \
            --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$GITHUB_OUTPUT:/github/output" \
            --env DEPLOYMENT_TOKEN \
            --env GITHUB_WORKSPACE=/github/workspace \
            --env GITHUB_OUTPUT=/github/output \
            --env INPUT_APP_LOCATION=preview \
            --env INPUT_CONFIG_FILE_LOCATION=preview \
            --env INPUT_API_LOCATION= \
            --env INPUT_OUTPUT_LOCATION= \
            --env INPUT_SKIP_APP_BUILD=true \
            --env INPUT_SKIP_API_BUILD=true \
            --env INPUT_DEPLOYMENT_ENVIRONMENT=preview \
            --entrypoint /bin/sh \
            mcr.microsoft.com/appsvc/staticappsclient:stable \
            -c 'cd /bin/staticsites && ./StaticSitesClient upload'
          if ! grep -Eq '^static_web_app_url=https://[a-z0-9-]+-preview\.([a-z0-9-]+\.)*azurestaticapps\.net/?$' "$GITHUB_OUTPUT"; then
            echo '::error::Azure did not deploy to the shared named preview environment.'
            exit 1
          fi
      - name: Report preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          PREVIEW_ORIGIN: ${{ steps.azure.outputs.static_web_app_url }}
        with:
          script: |
            const url = new URL('/', process.env.PREVIEW_ORIGIN);
            if (url.protocol !== 'https:' || !url.hostname.endsWith('.azurestaticapps.net')) {
              throw new Error('Unexpected Azure preview URL.');
            }
            const body = `Shared Azure preview for PR #${process.env.PR_NUMBER}, commit \`${process.env.HEAD_SHA}\`: ${url.href}\n\n` +
              'Full PR validation runs independently; this deployment does not certify that checks passed. ' +
              'This URL is shared by all PRs and is replaced by the next approved deployment. ' +
              'Public preview; production at https://mathixel.com/ and the GitHub Pages mirror are unchanged.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: Number(process.env.PR_NUMBER), body,
            });
            await core.summary.addRaw(body).write();
